[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labor-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over the Labor Code of the Republic of Armenia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
labor-rag = "labor_rag.cli:main"

[tool.setuptools]
packages = ["labor_rag"]
